    <!-- Google Platform & Maps Error Guard -->
    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          var msg = "";
          for (var i = 0; i < arguments.length; i++) {
            try {
              msg += " " + (typeof arguments[i] === "object" ? JSON.stringify(arguments[i]) : String(arguments[i]));
            } catch (_) {}
          }
          if (
            msg.indexOf("RefererNotAllowedMapError") !== -1 ||
            msg.indexOf("Google Maps JavaScript API error") !== -1 ||
            msg.indexOf("gm_authFailure") !== -1 ||
            msg.indexOf("google.rpc.ErrorInfo") !== -1 ||
            msg.indexOf("API_KEY_HTTP_REFERRER_BLOCKED") !== -1
          ) {
            return;
          }
          origError.apply(console, arguments);
        };
        window.addEventListener("error", function(e) {
          var eMsg = (e && e.message) ? String(e.message) : "";
          if (
            eMsg.indexOf("RefererNotAllowedMapError") !== -1 ||
            eMsg.indexOf("Google Maps JavaScript API error") !== -1 ||
            eMsg.indexOf("gm_authFailure") !== -1 ||
            eMsg.indexOf("google.rpc.ErrorInfo") !== -1 ||
            eMsg.indexOf("API_KEY_HTTP_REFERRER_BLOCKED") !== -1
          ) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
